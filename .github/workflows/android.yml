name: Android APK

on:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/FenceReport.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FenceReport-apk
          path: android-app/out/FenceReport.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Отчёт: заборы — сборка ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: android-app/out/FenceReport.apk
          body: |
            Установите FenceReport.apk на телефон (разрешите установку из неизвестных источников).
